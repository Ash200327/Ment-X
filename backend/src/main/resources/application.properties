spring.application.name=mentx
server.port=8080

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mentx}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configurations (256-bit key in hex)
mentx.jwtSecret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
mentx.jwtExpirationMs=86400000

# Admin Seeder credentials
app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@mentx.com}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:Ash@adminMent-X}

# Testing configurations: Bypass restrictions
mentx.bypass-deadline-restriction=${BYPASS_DEADLINE_RESTRICTION:true}
mentx.bypass-sunday-restriction=${BYPASS_SUNDAY_RESTRICTION:true}

# Swagger / OpenAPI Path Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Jackson Configuration for Hibernate Proxies
spring.jackson.serialization.fail-on-empty-beans=false

# Enable GZIP Response Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

